# Ngrok Configuration
# Place this in ~/.ngrok2/ngrok.yml or use with: ngrok start --config=ngrok.yml myapp

version: "2"
authtoken: YOUR_NGROK_AUTH_TOKEN_HERE

tunnels:
  myapp:
    proto: http
    addr: 3000
    domain: veritably-nonliquefiable-galina.ngrok-free.dev
    # Add custom request headers to bypass browser warning
    request_header:
      add:
        - "ngrok-skip-browser-warning: true"
    # Optional: inspect traffic in ngrok dashboard
    inspect: true

